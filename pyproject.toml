[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dsquic"
version = "0.0.1"
description = "A readable, spec-faithful QUIC / MASQUE / HTTP-3 implementation in pure Python."
readme = "README.md"
authors = [{ name = "Jeff Brown" }]
requires-python = ">=3.12"
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Education",
    "Programming Language :: Python :: 3",
    "Topic :: Internet",
    "Topic :: System :: Networking",
    "Typing :: Typed",
]
# cryptography supplies raw primitives only (AEAD, HKDF, signatures, X.509);
# the TLS 1.3 handshake is implemented in dsquic.tls.
dependencies = ["cryptography>=42"]

[project.urls]
Repository = "https://github.com/jeff-brown/dsquic"

[dependency-groups]
dev = [
    # aioquic is an independent QUIC stack, used only as an interop peer
    # in tests/interop; nothing in src/ may import it.
    "aioquic>=1.2",
    "mypy>=1.10",
    "pyright>=1.1.380",
    "pytest>=8",
    "ruff>=0.5",
]

[tool.hatch.build.targets.wheel]
packages = ["src/dsquic"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # bugbear
    "PL",  # pylint (ruff's native reimplementation)
    "RUF", # ruff-specific
]

[tool.ruff.lint.per-file-ignores]
# Tests assert against literal wire bytes and lengths; magic values are the point.
"tests/**" = ["PLR2004"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
enable_error_code = ["ignore-without-code", "redundant-expr", "truthy-bool"]
files = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
